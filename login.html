<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Site Protótipo</title>
    <link rel="stylesheet" href="estilo.css" />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <main class="conteudo-principal">
      <div class="cartao-login">
        <header
          class="cabecalho-login"
          style="box-shadow: none; padding: 0; margin-bottom: 20px"
        >
          <h2 class="titulo-secao">Entrar</h2>
          <p style="text-align: center; color: #666">
            Acesse sua conta para continuar
          </p>
        </header>

        <section class="autenticacao-google">
          <div
            id="g_id_onload"
            data-client_id="meu-site-prototipo"
            data-context="signin"
            data-ux_mode="popup"
            data-callback="processarLoginGoogle"
            data-auto_prompt="false"
          ></div>

          <div
            class="g_id_signin"
            data-type="standard"
            data-shape="rectangular"
            data-theme="outline"
            data-text="signin_with"
            data-size="large"
            data-logo_alignment="left"
            data-width="100%"
          ></div>
        </section>

        <div class="divisor">
          <span>ou use e-mail</span>
        </div>

        <form id="formulario-login" autocomplete="off">
          <div class="grupo-entrada">
            <label for="email">E-mail</label>
            <input
              type="email"
              id="email"
              placeholder="exemplo@email.com"
              required
              autocomplete="new-password"
            />
          </div>

          <div class="grupo-entrada">
            <label for="senha">Senha</label>
            <input
              type="password"
              id="senha"
              placeholder="Sua senha"
              required
              autocomplete="new-password"
            />
          </div>

          <button type="submit" class="botao-acessar">Entrar</button>

          <div class="links-auxiliares">
            <a href="#">Esqueceu a senha?</a>
            <p style="margin-top: 10px">
              Não tem conta? <a href="cadastro.html">Cadastre-se</a>
            </p>
          </div>
        </form>
      </div>
    </main>

    <footer>
      <p>&copy;2025 - Direitos Reservados</p>
    </footer>

    <script>
      function processarLoginGoogle(resposta) {
        alert("Login via Google realizado! Redirecionando para o cadastro...");
        window.location.href = "cadastro.html";
      }

      document
        .getElementById("formulario-login")
        .addEventListener("submit", function (e) {
          e.preventDefault();
          alert("Login realizado! Redirecionando para o cadastro...");
          window.location.href = "index.html";
        });
    </script>
  </body>
</html>
