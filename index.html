<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro - Site Protótipo</title>
    <link rel="stylesheet" href="estilo.css" />
  </head>
  <body>
    <main class="conteudo-principal">
      <div class="formulario-container">
        <h2 class="titulo-secao">Cadastro de Dados Pessoais</h2>

        <form id="formulario-registro" autocomplete="off">
          <div class="formulario-completo">
            <div class="campo-entrada campo-cheio">
              <label for="nome_completo">Nome Completo:</label>
              <input
                type="text"
                id="nome_completo"
                name="nome_completo"
                required
                autocomplete="new-password"
              />
            </div>

            <div class="campo-entrada">
              <label for="cpf">CPF:</label>
              <input
                type="text"
                id="cpf"
                name="cpf"
                placeholder="000.000.000-00"
                required
                autocomplete="new-password"
              />
            </div>

            <div class="campo-entrada">
              <label for="data_nascimento">Data de Nascimento:</label>
              <input
                type="date"
                id="data_nascimento"
                name="data_nascimento"
                required
                autocomplete="new-password"
              />
            </div>

            <div class="campo-entrada">
              <label for="genero">Gênero:</label>
              <select id="genero" name="genero" required>
                <option value="">Selecione</option>
                <option value="masculino">Masculino</option>
                <option value="feminino">Feminino</option>
                <option value="outro">Outro</option>
                <option value="prefiro_nao_dizer">Prefiro não dizer</option>
              </select>
            </div>

            <div class="campo-entrada">
              <label for="telefone">Telefone/WhatsApp:</label>
              <input
                type="tel"
                id="telefone"
                name="telefone"
                placeholder="(00) 00000-0000"
                required
                autocomplete="new-password"
              />
            </div>

            <div class="campo-entrada campo-cheio">
              <label for="email">E-mail:</label>
              <input
                type="email"
                id="email"
                name="email"
                required
                autocomplete="new-password"
              />
            </div>

            <div class="campo-entrada">
              <label for="cep">CEP:</label>
              <input
                type="text"
                id="cep"
                name="cep"
                placeholder="00000-000"
                required
                autocomplete="new-password"
              />
            </div>

            <div class="campo-entrada">
              <label for="logradouro">Logradouro (Rua/Av):</label>
              <input
                type="text"
                id="logradouro"
                name="logradouro"
                required
                autocomplete="new-password"
              />
            </div>

            <div class="campo-entrada">
              <label for="numero">Número:</label>
              <input
                type="text"
                id="numero"
                name="numero"
                required
                autocomplete="new-password"
              />
            </div>

            <div class="campo-entrada">
              <label for="bairro">Bairro:</label>
              <input
                type="text"
                id="bairro"
                name="bairro"
                required
                autocomplete="new-password"
              />
            </div>

            <div class="campo-entrada">
              <label for="cidade">Cidade:</label>
              <input
                type="text"
                id="cidade"
                name="cidade"
                required
                autocomplete="new-password"
              />
            </div>

            <div class="campo-entrada">
              <label for="estado">Estado:</label>
              <select id="estado" name="estado" required>
                <option value="">Selecione</option>
                <option value="AC">Acre</option>
                <option value="AL">Alagoas</option>
                <option value="AP">Amapá</option>
                <option value="AM">Amazonas</option>
                <option value="BA">Bahia</option>
                <option value="CE">Ceará</option>
                <option value="DF">Distrito Federal</option>
                <option value="ES">Espírito Santo</option>
                <option value="GO">Goiás</option>
                <option value="MA">Maranhão</option>
                <option value="MT">Mato Grosso</option>
                <option value="MS">Mato Grosso do Sul</option>
                <option value="MG">Minas Gerais</option>
                <option value="PA">Pará</option>
                <option value="PB">Paraíba</option>
                <option value="PR">Paraná</option>
                <option value="PE">Pernambuco</option>
                <option value="PI">Piauí</option>
                <option value="RJ">Rio de Janeiro</option>
                <option value="RN">Rio Grande do Norte</option>
                <option value="RS">Rio Grande do Sul</option>
                <option value="RO">Rondônia</option>
                <option value="RR">Roraima</option>
                <option value="SC">Santa Catarina</option>
                <option value="SP">São Paulo</option>
                <option value="SE">Sergipe</option>
                <option value="TO">Tocantins</option>
              </select>
            </div>

            <button type="submit" class="botao-cadastrar">
              Finalizar Cadastro
            </button>
          </div>
        </form>
      </div>
    </main>

    <footer>
      <p>&copy;2025 - Direitos Reservados</p>
    </footer>

    <script>
      document
        .getElementById("formulario-registro")
        .addEventListener("submit", function (e) {
          e.preventDefault();
          alert("Cadastro enviado com sucesso!");
        });
    </script>
  </body>
</html>
